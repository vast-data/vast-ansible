---
minor_changes:
  - Widened ``requires_ansible`` to ``>=2.15.0`` to support a broad ansible-core range.
  - Added an Apache-2.0 ``LICENSE`` file and aligned all plugin file headers to Apache-2.0 (SPDX), matching the declared collection license.
  - Adopted ``antsibull-changelog`` for changelog generation (``changelogs/`` config, seeded history, and a fragment workflow).
  - Unified the resource base-class connection/version setup and the module/lookup connection builders into a single shared implementation.
  - Sub-endpoint update modules now use the shared ``values_equal`` comparison for more accurate idempotency (parity with the main resource diff engine).
  - Added a multi-version (5.4 + 5.5) generation target and a swagger-diff gate to the ``Makefile``; refreshed the architecture documentation and added
    ``docs/`` usage and multi-version guides.
bugfixes:
  - The REST client now raises a typed ``VastNotFoundError`` on HTTP 404 and wraps low-level transport errors as ``VastAPIError`` instead of relying on
    error-message string matching.
  - Excluded build artifacts (tarballs) and test/cache directories from the built collection so the published artifact is clean.
